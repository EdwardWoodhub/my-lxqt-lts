name: my-plasma-lts-vm
description: Bluefin GDX (CentOS Stream 10) + KDE Plasma 6
base-image: ghcr.io/ublue-os/bluefin-gdx
image-version: lts-testing-amd64

modules:
  # ------------------------------------------------------------
  # 1. 软件源 (开启 EPEL 10 与 v2rayA COPR 源)
  # ------------------------------------------------------------
  - type: script
    snippets:
      - |
        # 启用 EPEL 10 仓库
        rpm -Uvh https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm || true
        
        # 引入 v2rayA COPR 源
        #curl -Lo /etc/yum.repos.d/_copr_zhullyb-v2rayA.repo https://copr.fedorainfracloud.org/coprs/zhullyb/v2rayA/repo/centos-stream-10/zhullyb-v2rayA-centos-stream-10.repo
        #sed -i 's/\$releasever/10/g' /etc/yum.repos.d/_copr_zhullyb-v2rayA.repo

  # ------------------------------------------------------------
  # 2. Flatpak 软件 (替代 EL10 中缺失的原生应用)
  # ------------------------------------------------------------
  - type: default-flatpaks@v1
    notify: true
    system:
      install:
        - org.mozilla.firefox
        - com.google.Chrome
        - com.github.tchx84.Flatseal
        - com.xnview.XnViewMP
        - com.visualstudio.code
        - net.nokyan.Resources
        - io.missioncenter.MissionCenter
        - io.github.peazip.PeaZip

  # ------------------------------------------------------------
  # 3. RPM 软件包 (适配 EL10 的最小可用 Plasma 6 闭环)
  # ------------------------------------------------------------
  - type: rpm-ostree
    install:
      # --- 渲染与 Wayland 基础设施 ---
      - mesa-dri-drivers
      - xorg-x11-server-Xwayland
      - sddm
      - dbus-x11
      - xdg-desktop-portal
      - xdg-user-dirs

      # --- KDE Plasma 6 桌面核心组件 ---
      - plasma-workspace
      - plasma-desktop
      - kwin
      - polkit-kde
      - plasma-firewall-firewalld

      # --- KDE 常用应用 ---
      - dolphin
      - konsole
      - kate

      # --- 后台服务与基础工具 ---
      - syncthing
      #- v2raya
      #- firewalld
      - git
      - htop
      - btop

  # ------------------------------------------------------------
  # 4. 系统环境与自动登录配置
  # ------------------------------------------------------------
  - type: script
    snippets:
      - |
        # 写入 Wayland 与 KDE 环境变量
        echo "WLR_NO_HARDWARE_CURSORS=1" >> /etc/environment
        echo "XDG_CURRENT_DESKTOP=KDE" >> /etc/environment
        echo "XDG_SESSION_TYPE=wayland" >> /etc/environment

        # 创建用户 Linger 标志文件
        mkdir -p /var/lib/systemd/linger
        touch /var/lib/systemd/linger/edward
        touch /var/lib/systemd/linger/bob

        # 防火墙开放端口
        firewall-offline-cmd --add-port=8384/tcp

        # 配置 SDDM 自动登录进 Plasma Wayland 会话
        mkdir -p /etc/sddm.conf.d
        cat <<EOF > /etc/sddm.conf.d/autologin.conf
        [Autologin]
        User=edward
        Session=wayland-plasma
        [General]
        DisplayServer=wayland
        EOF

  # ------------------------------------------------------------
  # 5. 动态用户服务 (Syncthing)
  # ------------------------------------------------------------
  - type: script
    snippets:
      - |
        mkdir -p /usr/lib/systemd/user/
        cat <<EOF > /usr/lib/systemd/user/syncthing.service
        [Unit]
        Description=Syncthing Service
        After=network.target

        [Service]
        Environment=HOME=%h
        ExecStartPre=/usr/bin/mkdir -p %h/.config/syncthing
        ExecStart=/usr/bin/syncthing serve --no-browser --no-restart --gui-address=127.0.0.1:8384
        Restart=on-failure
        RestartSec=10

        [Install]
        WantedBy=default.target
        EOF

  # ------------------------------------------------------------
  # 6. 系统服务控制
  # ------------------------------------------------------------
  - type: systemd
    system:
      disabled:
        - gdm.service          # 禁用原生 GNOME 登录界面，避免与 SDDM 冲突
      enabled:
        - sddm.service         # 启用 SDDM 登录界面
        #- v2raya.service
        - firewalld.service
    user:
      enabled:
        - syncthing.service
